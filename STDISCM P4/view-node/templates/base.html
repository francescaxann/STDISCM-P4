<!doctype html><html><head><meta charset="utf-8"><title>Online Enrollment</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.nav{background:#183b66;color:white;padding:1rem 2rem}.nav a{color:white;margin-right:1rem}.box{max-width:900px;margin:2rem auto;background:white;padding:2rem;border-radius:10px}.warning{background:#fff4ce;border-left:4px solid #e7a500;padding:.8rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.card{border:1px solid #ddd;border-radius:8px;padding:1rem}button,input{padding:.6rem;margin:.2rem}</style></head><body><div class="nav"><a href="/">Enrollment System</a>{% if claims %}<a href="/courses">Courses</a><a href="/grades">Grades</a><a href="/receipts">Receipts</a><form style="display:inline" method="post" action="/logout"><button>Logout</button></form>{% endif %}</div><main class="box">{% with messages=get_flashed_messages() %}{% if messages %}{% for message in messages %}<p class="warning">{{message}}</p>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
